appId: com.torch.agent
productName: TORCH
directories:
  buildResources: build
# An allowlist, deliberately. Anything not named here stays out of app.asar.
# The previous exclusion list let the whole repository in: both virtualenvs,
# the website and promo sub-projects with their own node_modules, build
# scratch directories, log files, and data/ - which holds the local SQLite
# database, so every installer would have shipped one machine's task history.
files:
  - 'out/**'
  - 'resources/**'
  - 'package.json'
  - 'node_modules/**'
  - '!**/.vscode/*'
  - '!**/*.map'
# The backend ships as a self-contained PyInstaller bundle, so the installed
# app never needs Python present on the machine. Build it first:
#   python backend/build_backend.py
extraResources:
  - from: dist-backend/torch-backend
    to: backend
    filter:
      - '**/*'
asarUnpack:
  - resources/**
win:
  executableName: torch
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: T-O-R-C-H
  repo: T.O.R.C.H
