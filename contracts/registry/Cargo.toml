[package]
name = "torch-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Soroban registry of contracts to keep alive before their entries archive"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
